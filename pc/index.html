<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>مُزيل موسيقى الفيديو</title>
<style>
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;min-height:100vh;
    background:linear-gradient(135deg,#5B3DF5,#0EA5E9,#10B9A0);display:flex;align-items:center;
    justify-content:center;padding:16px;box-sizing:border-box}
  .card{background:#fff;border-radius:28px;max-width:420px;width:100%;padding:28px 22px;text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.2)}
  .logo{width:84px;height:84px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;
    justify-content:center;font-size:42px;background:linear-gradient(135deg,#5B3DF5,#10B9A0)}
  h1{margin:0 0 6px;color:#1E1B3A;font-size:24px}
  p{color:#6B6890;margin:0}
  .foot{margin-top:18px;color:#9a97b8;font-size:12px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">🎵</div>
  <h1>مُزيل موسيقى الفيديو</h1>
  <p id="msg">جاري فتح صفحة التنزيل...</p>
  <div class="foot">برمجة: سعيد باسودان · جميع الحقوق محفوظة</div>
</div>
<script>
  // المفتاح السري يأتي بعد علامة # في الرابط الذي يرسله صاحب التطبيق، ولا يُرسل لخوادم GitHub أبداً.
  // هذه الصفحة لا تحتوي أي سر؛ بدون المفتاح الصحيح لا تفتح صفحة التنزيل.
  var key = decodeURIComponent((location.hash || "").slice(1)).replace(/[^A-Za-z0-9_-]/g, "");
  if (key) {
    location.replace("https://mypropertiesksa--vmr-separator-dl.us-east.modal.run/pc?k=" + encodeURIComponent(key));
  } else {
    document.getElementById("msg").textContent = "هذا التطبيق خاص. اطلب رابط التنزيل من صاحب التطبيق.";
  }
</script>
</body>
</html>
